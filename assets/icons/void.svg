<!--
  Void tile styled to match skills.syvixor.com icons (256x256, rx=40, dark/light aware).
  The viewBox starts at x=-44 so the tile carries the same 44-unit left gap the API uses
  between tiles; placed right after the previous image, the spacing lines up exactly.
  The official mark is a near-black sphere, so a faint ring is drawn on the dark tile
  to keep its outline visible; the light tile does not need it.
  Mark: https://github.com/voidzero-dev/void/blob/main/docs/public/icon.svg (MIT)
-->
<svg width="56.25" height="48" viewBox="-44 0 300 256" fill="none" xmlns="http://www.w3.org/2000/svg" id="void">
<title>Void</title>
<style>
#void .tile { fill: #15191C }
#void .ring { stroke: #FFFFFF; stroke-opacity: 0.28 }
@media (prefers-color-scheme: light) {
  #void .tile { fill: #F4F2ED }
  #void .ring { stroke-opacity: 0 }
}
</style>
<rect class="tile" width="256" height="256" rx="40" fill="#15191C"/>
<svg x="68" y="68" width="120" height="120" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="50%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="brand" cx="0.35" cy="0.4" r="0.65">
      <stop offset="0%" stop-color="#4f30e8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f30e8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#base)"/>
    <rect width="512" height="512" fill="url(#brand)"/>
  </g></svg>
<circle class="ring" cx="128" cy="128" r="61" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
</svg>
